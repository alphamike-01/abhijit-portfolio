    <script>
      // Clean up any stale service workers or caches from other localhost projects (e.g. WavePlay)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
            console.log('Unregistered stale service worker:', registration.scope);
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            if (name.includes('waveplay') || name.includes('workbox')) {
              caches.delete(name);
              console.log('Cleared stale cache:', name);
            }
          }
        });
      }
    </script>
